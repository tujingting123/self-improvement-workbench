<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下载</title>
</head>
<body style="margin:0;padding:0;font-family:-apple-system,sans-serif;background:#fff5f7;text-align:center;padding-top:80px;">
<h2 style="color:#ff6b85;margin-bottom:30px;">下载离线版工作台</h2>
<p style="color:#8a8a8a;font-size:14px;margin-bottom:30px;">点击下方按钮，选择「下载」</p>
<script>
fetch('self-improvement-workbench-standalone.html')
  .then(r => r.text())
  .then(text => {
    const blob = new Blob([text], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    document.getElementById('dl').href = url;
  });
</script>
<a id="dl" download="自我提升工作台.html" style="display:inline-block;padding:20px 50px;background:linear-gradient(135deg,#ff8fa3,#ff6b85);color:#fff;text-decoration:none;border-radius:40px;font-size:20px;font-weight:bold;box-shadow:0 6px 20px rgba(255,143,163,0.4);">📥 点击下载</a>
<p style="margin-top:30px;font-size:12px;color:#bbb;">下载后到「文件」App找到此文件，用Safari打开</p>
</body>
</html>
